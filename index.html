<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 1.1</title>
</head>
<body>
    <script>
        const onLoad = (evt) => {
            const script = evt.target;
            const componentName = script.dataset.name;

            if (!/^[a-z][a-z0-9]*-[a-z0-9-]*$/.test(componentName)) {
                console.error(`Невалидное имя компонента: ${componentName}`);
                return;
            }

            if (customElements.get(componentName)) {
                console.log(`Веб-компонент ${componentName} успешно зарегистрирован`);

                const element = document.createElement(componentName);
                document.body.appendChild(element);
            }
        }

        const onError = (err) => {
            console.error('Ошибка загрузки:', err);
        }

        const components = ['my-select'];

        components.forEach(component => {
            const script = document.createElement('script');
            script.src = `./${component}.js`;
            script.dataset.name = component;
            script.addEventListener('load', onLoad);
            script.addEventListener('error', onError);
            document.body.append(script);
        });
    </script>
</body>
</html>
